syntax = "proto3";
package dshm.v1;

// Backwards pages share one fixed DSH journal cut. An absent before_seq opens the latest page.
message ReadSession {
  string task_id = 1;
  optional uint64 through_seq = 2;
  optional uint64 before_seq = 3;
}
message SessionMessage {
  uint64 seq = 1;
  bool from_user = 2;
  string text = 3;
}
message SessionPage {
  repeated SessionMessage messages = 1;
  uint64 through_seq = 2;
  optional uint64 next_before_seq = 3;
}
