# Used by scripts/codegen. Plugins come from bridge/node_modules/.bin (protoc-gen-es)
# and ios/DSHKit/.build (protoc-gen-swift); see ARCHITECTURE.md.
version: v2
clean: true
plugins:
  - local: protoc-gen-es
    out: ../bridge/src/gen
    opt:
      - target=ts
      - import_extension=js
  - local: protoc-gen-swift
    out: ../ios/DSHKit/Sources/DSHProtocol/Generated
    opt:
      - Visibility=Package
      - FileNaming=DropPath
