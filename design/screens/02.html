<div class="cap"><h3><i>02</i>工作区抽屉 · 左缘右滑<span class="mtag m1">M1 · 改导航</span></h3><ul>
  <li>和桌面侧栏同色同结构：新建会话 → 「所有任务」 → 执行端 › 工作区 › 会话。</li>
  <li>会话包括网页、桌面端发起的；琥珀点 = 等你，转圈 = 在跑，蓝点 = 完成未读。</li>
  <li>工作区就是执行端上的文件夹；离线执行端变灰，缓存的会话照样能看。</li>
  <li>底部：配对（扫码）和设置；设备与审计在每台执行端里（H）。</li>
</ul></div>
