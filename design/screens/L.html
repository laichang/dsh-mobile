<div class="cap"><h3><i>L</i>锁屏<span class="mtag mx">本机实时活动</span></h3><ul>
  <li>实时活动（§4）：每个运行中的任务一个，在锁屏和灵动岛上：标题、执行端 · 最新一步、计时（App 挂起时也在走）、n/m 进度。</li>
  <li>完成、失败、停止，或等你批准、回答时结束，留在锁屏上；再运行时换成新的一个。只在本机更新（App 在前台时）；久未更新时标“未更新”。</li>
</ul></div>
