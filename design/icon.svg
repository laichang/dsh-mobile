<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    dsh-mobile app icon (DESIGN.md "App icon"). Original artwork: a phone in front that sends work
    to a terminal window, the user's own computer. Colors come from the DESIGN.md visual language.
    scripts/render-icon sets the CSS variables per appearance (default, dark, tinted) and writes
    the PNGs into ios/dsh-mobile/Assets.xcassets/AppIcon.appiconset/.
    Safe area: every shape stays inside x 170..854, y 200..860, away from the masked corners.
  -->
  <style>
    .bg-top { stop-color: var(--bg-top, #5B78FF); }
    .bg-bottom { stop-color: var(--bg-bottom, #3049D8); }
    .bg { display: var(--bg-display, inline); }
    .window { fill: var(--window, #151517); }
    .prompt { stroke: var(--prompt, #F9FAFB); }
    .phone { fill: var(--phone, #F9FAFB); }
    .send { stroke: var(--send, #4D6BFE); }
    .glyph { fill: none; stroke-width: 46; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="bg-top"/>
      <stop offset="1" class="bg-bottom"/>
    </linearGradient>
    <!-- Cuts a gap around the phone out of the window, so the two shapes read apart on any background. -->
    <mask id="phone-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="170" y="420" width="296" height="464" rx="82" fill="#000"/>
    </mask>
  </defs>

  <rect class="bg" width="1024" height="1024" fill="url(#bg)"/>

  <!-- The computer: a terminal window with a prompt and a cursor. -->
  <g mask="url(#phone-gap)">
    <rect class="window" x="304" y="200" width="550" height="420" rx="72"/>
    <path class="glyph prompt" d="M500 330 L584 400 L500 470"/>
    <path class="glyph prompt" d="M632 478 L736 478"/>
  </g>

  <!-- The phone: it sends the task up and to the right, to the computer. -->
  <rect class="phone" x="194" y="444" width="248" height="416" rx="60"/>
  <path class="glyph send" d="M268 708 L366 610 M296 606 L370 606 L370 680"/>
</svg>
